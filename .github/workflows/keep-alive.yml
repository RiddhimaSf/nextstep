name: Keep Render Instance Alive

# Free-tier Render web services spin down after 15 minutes of inactivity,
# causing a 30-60 second cold start on the next real request — a real
# risk if an interviewer clicks the demo link cold. This workflow pings
# Streamlit's built-in health endpoint (/_stcore/health) every 10 minutes,
# well under the 15-minute spin-down window, using free GitHub Actions
# infrastructure rather than a third-party pinging service — consistent
# with keeping this "boring and owned," not dependent on an unfamiliar
# external tool.
#
# Honest limitation: this is a common community workaround, not an
# officially guaranteed mechanism from Render. If it stops working
# reliably, the fallback is simply accepting and documenting the cold
# start in the README's demo script.

on:
  schedule:
    - cron: '*/10 * * * *'  # every 10 minutes
  workflow_dispatch:  # allows manually triggering a run from GitHub's UI, useful for testing this workflow itself

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping NextStep health endpoint
        run: |
          curl -f https://nextstep-9ppb.onrender.com/_stcore/health || echo "Ping failed — service may be cold-starting or down"